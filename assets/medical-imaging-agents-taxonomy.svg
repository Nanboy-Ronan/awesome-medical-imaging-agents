<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 688" width="1040" height="688" role="img" aria-labelledby="title description">
<title id="title">Medical Imaging Agents: Four-Axis Taxonomy</title>
<desc id="description">Four independent classification axes: application and input, clinical task, agent mechanism, and evaluation and resources. Each paper has one primary home and can have multiple cross-cutting labels.</desc>
<rect x="1" y="1" width="1038" height="686" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="28" y="42" font-size="25" font-weight="700" fill="#0f172a">Medical Imaging Agents</text>
<text x="28" y="74" font-size="17" fill="#475569">Four independent axes for browsing and classifying research</text>
<rect x="28" y="104" width="480" height="230" rx="12" fill="white" stroke="#e2e8f0"/>
<rect x="28" y="104" width="7" height="230" rx="3" fill="#2563eb"/>
<text x="52" y="140" font-size="14" font-weight="700" fill="#2563eb">01</text>
<text x="89" y="141" font-size="22" font-weight="700" fill="#0f172a">Application &amp; input</text>
<text x="52" y="171" font-size="16" fill="#2563eb">Where is it used?</text>
<text x="52" y="211" font-size="16" fill="#334155">Radiology · Pathology · Ultrasound</text>
<text x="52" y="241" font-size="16" fill="#334155">Endoscopy &amp; surgery · Ophthalmology</text>
<text x="52" y="271" font-size="16" fill="#334155">Inputs: CXR · CT · MRI · PET · WSI · OCT</text>
<text x="52" y="301" font-size="16" fill="#334155">Representations: 2D · 3D · video · multimodal</text>
<rect x="532" y="104" width="480" height="230" rx="12" fill="white" stroke="#e2e8f0"/>
<rect x="532" y="104" width="7" height="230" rx="3" fill="#0f766e"/>
<text x="556" y="140" font-size="14" font-weight="700" fill="#0f766e">02</text>
<text x="593" y="141" font-size="22" font-weight="700" fill="#0f172a">Clinical task</text>
<text x="556" y="171" font-size="16" fill="#0f766e">What does it do?</text>
<text x="556" y="211" font-size="16" fill="#334155">Acquisition · Navigation · Data preparation</text>
<text x="556" y="241" font-size="16" fill="#334155">Diagnosis · Visual reasoning · Triage</text>
<text x="556" y="271" font-size="16" fill="#334155">Segmentation · Localization · Annotation</text>
<text x="556" y="301" font-size="16" fill="#334155">Reporting · Treatment planning · Workflows</text>
<rect x="28" y="358" width="480" height="230" rx="12" fill="white" stroke="#e2e8f0"/>
<rect x="28" y="358" width="7" height="230" rx="3" fill="#7c3aed"/>
<text x="52" y="394" font-size="14" font-weight="700" fill="#7c3aed">03</text>
<text x="89" y="395" font-size="22" font-weight="700" fill="#0f172a">Agent mechanism</text>
<text x="52" y="425" font-size="16" fill="#7c3aed">How does it operate?</text>
<text x="52" y="465" font-size="16" fill="#334155">Tool use &amp; planning · Retrieval / RAG</text>
<text x="52" y="495" font-size="16" fill="#334155">Multi-agent collaboration</text>
<text x="52" y="525" font-size="16" fill="#334155">Reinforcement learning · Human feedback</text>
<text x="52" y="555" font-size="16" fill="#334155">Memory · Skill learning · Self-improvement</text>
<rect x="532" y="358" width="480" height="230" rx="12" fill="white" stroke="#e2e8f0"/>
<rect x="532" y="358" width="7" height="230" rx="3" fill="#b45309"/>
<text x="556" y="394" font-size="14" font-weight="700" fill="#b45309">04</text>
<text x="593" y="395" font-size="22" font-weight="700" fill="#0f172a">Evaluation &amp; resources</text>
<text x="556" y="425" font-size="16" fill="#b45309">How is it assessed or reused?</text>
<text x="556" y="465" font-size="16" fill="#334155">Output quality · Process &amp; workflow evaluation</text>
<text x="556" y="495" font-size="16" fill="#334155">Reliability · Safety · Fairness · Privacy</text>
<text x="556" y="525" font-size="16" fill="#334155">Benchmarks · Datasets · Tools</text>
<text x="556" y="555" font-size="16" fill="#334155">Foundation models · Surveys</text>
<rect x="28" y="610" width="984" height="54" rx="10" fill="#e2e8f0"/>
<text x="520" y="643" text-anchor="middle" font-size="17" font-weight="600" fill="#334155">One primary entry per paper + multiple task, mechanism, and evaluation labels</text>
</g>
</svg>
